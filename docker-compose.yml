services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-labs1}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ['5432:5432']
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports: ['8000:8000']
    depends_on: [db]
