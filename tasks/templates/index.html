<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лабораторные — проекты</title>
  <style>
    body{font:16px Arial,sans-serif;background:#f4f6f8;color:#182230;margin:0}
    main{max-width:900px;margin:40px auto;padding:0 20px}
    .card{background:white;border-radius:12px;padding:24px;margin:16px 0;box-shadow:0 2px 10px #0001}
    input,textarea,button{font:inherit;padding:10px;margin:5px 0;border:1px solid #ccd3dc;border-radius:7px}
    input,textarea{display:block;width:min(100%,420px);box-sizing:border-box}
    button{background:#2563eb;color:white;border:0;cursor:pointer;padding:10px 16px}
    button.secondary{background:#64748b}.muted{color:#64748b}.error{color:#b91c1c}.project{border-top:1px solid #e5e7eb;padding:12px 0}
  </style>
</head>
<body><main>
  <h1>Управление проектами</h1>
  <p class="muted">Минимальный интерфейс лабораторного проекта</p>
  <section class="card">
    <h2>Вход</h2>
    <input id="username" placeholder="Логин">
    <input id="password" type="password" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <button class="secondary" onclick="logout()">Выйти</button>
    <p id="authMessage" class="muted"></p>
  </section>
  <section class="card">
    <h2>Новый проект</h2>
    <input id="name" placeholder="Название проекта">
    <textarea id="description" placeholder="Описание"></textarea>
    <button onclick="createProject()">Создать</button>
    <p id="projectMessage" class="error"></p>
  </section>
  <section class="card"><h2>Мои проекты</h2><div id="projects" class="muted">Войдите, чтобы загрузить проекты.</div></section>
<script>
const api='/api/';
const usernameInput=document.getElementById('username');
const passwordInput=document.getElementById('password');
const nameInput=document.getElementById('name');
const descriptionInput=document.getElementById('description');
const authMessage=document.getElementById('authMessage');
const projectMessage=document.getElementById('projectMessage');
const projects=document.getElementById('projects');
function token(){return localStorage.getItem('access')}
async function login(){
  const r=await fetch('/api/token/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:usernameInput.value,password:passwordInput.value})});
  const d=await r.json(); if(!r.ok){authMessage.textContent='Ошибка входа: '+JSON.stringify(d);return}
  localStorage.setItem('access',d.access); authMessage.textContent='Вход выполнен'; loadProjects();
}
function logout(){localStorage.removeItem('access');projects.textContent='Выполнен выход.';authMessage.textContent=''}
async function loadProjects(){
  const r=await fetch(api+'projects/',{headers:{Authorization:'Bearer '+token()}}); const d=await r.json();
  if(!r.ok){projects.textContent='Ошибка: '+JSON.stringify(d);return}
  projects.innerHTML=d.results?.length?d.results.map(p=>`<div class="project"><b>${p.name}</b><br>${p.description||''}</div>`).join(''):'Проектов пока нет.';
}
async function createProject(){
  projectMessage.textContent=''; const r=await fetch(api+'projects/',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:JSON.stringify({name:nameInput.value,description:descriptionInput.value})});
  const d=await r.json(); if(!r.ok){projectMessage.textContent='Ошибка: '+JSON.stringify(d);return} nameInput.value='';descriptionInput.value='';loadProjects();
}
</script></main></body></html>
